<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Post not found — Pulse</title>
  <th:block th:replace="~{fragments/layout :: head-assets}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<main class="container" style="max-width:520px">
  <h1 class="page-title">Post not found</h1>
  <p class="alert alert-error" th:text="${errorMessage}">This post isn't available anymore.</p>
  <a th:href="@{/}" class="btn btn-outline">Back to the feed</a>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
