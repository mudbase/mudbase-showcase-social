spring.application.name=mudbase-showcase-social-java
server.port=${PORT:8080}

# --- Mudbase project wiring ---------------------------------------------------
mudbase.base-url=${MUDBASE_URL:https://cloud.mudbase.dev}
mudbase.project-id=${MUDBASE_PROJECT_ID:}
mudbase.posts-collection-id=${MUDBASE_POSTS_COLLECTION_ID:}
mudbase.comments-collection-id=${MUDBASE_COMMENTS_COLLECTION_ID:}
mudbase.likes-collection-id=${MUDBASE_LIKES_COLLECTION_ID:}
mudbase.follows-collection-id=${MUDBASE_FOLLOWS_COLLECTION_ID:}

# --- Thymeleaf ------------------------------------------------------------------
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# --- Sessions ---------------------------------------------------------------
server.servlet.session.timeout=30m

logging.level.dev.mudbase.showcase.social=INFO
